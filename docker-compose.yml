services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: the-gang-pgvector
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: gang
      POSTGRES_PASSWORD: gang
      POSTGRES_DB: gang
    volumes:
      - gang_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gang -d gang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gang_pgdata:
